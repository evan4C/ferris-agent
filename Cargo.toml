[package]
name = "ferris-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.5.51", features = ["derive"] }
directories = "6.0"
keyring = "3.6"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.8"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
